# Fixture négative : input interpolé dans le paramètre script: d'actions/github-script.
name: fixture
on:
  workflow_call:
    inputs:
      profile:
        type: string
jobs:
  script:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const profile = "${{ inputs.profile }}";
            core.info(profile);
