# Fixture positive : defaults.run est un mapping, env: frère d un run: | reçoit un input,
# et une ligne de script « label : valeur » dans un bloc run: | n'est pas lue comme YAML.
name: fixture
on:
  workflow_call:
    inputs:
      dir:
        type: string
defaults:
  run:
    shell: bash
    working-directory: ${{ inputs.dir }}
jobs:
  j:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - run: |
          echo "$DIR"
          label : valeur
        env:
          DIR: ${{ inputs.dir }}
      - run: echo done
