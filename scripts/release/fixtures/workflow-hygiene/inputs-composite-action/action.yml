# Fixture négative : action composite dont un run: interpole un input.
name: Fixture composite
description: Input interpolé dans un bloc run d'action composite.
inputs:
  model:
    description: Modèle
    required: true
runs:
  using: composite
  steps:
    - name: Pull
      shell: bash
      run: |
        ollama pull "${{ inputs.model }}"
