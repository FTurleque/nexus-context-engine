# Use random available ports for both application and management HTTP servers so
# tests are hermetic regardless of what already runs on the default test ports.
# RestAssured is automatically reconfigured by Quarkus for the application port.
quarkus.http.test-port=0
quarkus.http.test-ssl-port=0
quarkus.management.test-port=0

# REST loopback trust is explicit in the test profile. Production keeps the
# fail-closed default and requires a Bearer token unless the operator deliberately
# configures nexus.rest.trust-local/NEXUS_REST_TRUST_LOCAL=true.
nexus.rest.trust-local=true
