name: OSV-Scanner

on:
  workflow_call:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  schedule:
    - cron: '31 4 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: osv-scanner-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan-pr:
    name: OSV new-vulnerability delta gate
    if: ${{ github.event_name == 'pull_request' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@8ac9e5ce44cc7178e0e04229a91bdcc003166e57 # fail closed on incomplete scans
    permissions:
      actions: read
      contents: read
      security-events: write

  build-sbom:
    name: Build aggregate reactor SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve the Maven reactor and generate CycloneDX
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./mvnw
          ./mvnw -B -DskipTests verify
          test -s target/sbom/bom.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          bom = json.loads(Path('target/sbom/bom.json').read_text(encoding='utf-8'))
          components = bom.get('components', [])
          if len(components) < 20:
              raise SystemExit(f'Aggregate SBOM is unexpectedly incomplete: {len(components)} components')
          print(f'aggregate-sbom-components={len(components)}')
          PY
          cp target/sbom/bom.json nexus.cdx.json

      - name: Upload aggregate SBOM for OSV
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: nexus-aggregate-sbom
          path: nexus.cdx.json
          if-no-files-found: error
          retention-days: 14

  scan-sbom:
    name: OSV aggregate SBOM vulnerability gate
    needs: build-sbom
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8ac9e5ce44cc7178e0e04229a91bdcc003166e57 # fail closed on incomplete scans
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      download-artifact: nexus-aggregate-sbom
      scan-args: |-
        --sbom=nexus.cdx.json
      fail-on-vuln: true
