name: OSV-Scanner

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '31 4 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-pr:
    name: OSV new-vulnerability delta gate
    if: ${{ github.event_name == 'pull_request' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@ffa0a5f39214d80778c9b494822d94d0d9668458 # v2.3.8
    permissions:
      actions: read
      contents: read
      security-events: write

  build-sbom:
    name: Build aggregate reactor SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve the Maven reactor and generate CycloneDX
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./mvnw
          ./mvnw -B -DskipTests verify
          test -s target/sbom/bom.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          bom = json.loads(Path('target/sbom/bom.json').read_text(encoding='utf-8'))
          components = bom.get('components', [])
          if len(components) < 20:
              raise SystemExit(f'Aggregate SBOM is unexpectedly incomplete: {len(components)} components')
          print(f'aggregate-sbom-components={len(components)}')
          PY
          cp target/sbom/bom.json nexus.cdx.json

      - name: Upload aggregate SBOM for OSV
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: nexus-aggregate-sbom
          path: nexus.cdx.json
          if-no-files-found: error
          retention-days: 14

  scan-sbom:
    name: OSV aggregate SBOM vulnerability gate
    needs: build-sbom
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9fd1bcce27f67e3bd819a0a7620e332803dc43bc # v2.3.8
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      download-artifact: nexus-aggregate-sbom
      scan-args: |-
        --sbom=nexus.cdx.json
      fail-on-vuln: true
