name: CodeQL

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - develop
      - main
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Java analysis
    runs-on: ubuntu-latest
    env:
      NEXUS_CODEQL_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact qualified head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.NEXUS_CODEQL_HEAD_SHA }}

      - name: Assert exact-head contract
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          if [[ "$ACTUAL" != "$NEXUS_CODEQL_HEAD_SHA" ]]; then
            echo "::error::CodeQL checkout drift: expected=$NEXUS_CODEQL_HEAD_SHA actual=$ACTUAL"
            exit 1
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended

      - name: Analyze exact head
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:java-kotlin'
