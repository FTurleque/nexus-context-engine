name: CodeQL

on:
  workflow_call:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL Java analysis
    runs-on: ubuntu-latest
    env:
      NEXUS_CODEQL_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact qualified head
        uses: actions/checkout@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          fetch-depth: 0
          ref: ${{ env.NEXUS_CODEQL_HEAD_SHA }}

      - name: Assert exact-head contract
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          if [[ "$ACTUAL" != "$NEXUS_CODEQL_HEAD_SHA" ]]; then
            echo "::error::CodeQL checkout drift: expected=$NEXUS_CODEQL_HEAD_SHA actual=$ACTUAL"
            exit 1
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended

      - name: Analyze exact head
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: '/language:java-kotlin'
