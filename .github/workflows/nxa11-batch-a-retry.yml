name: NXA11 Sonar cleanup batch A retry

on:
  push:
    branches:
      - fix/nxa11-sonar-promotion-maintainability

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/nxa11-sonar-promotion-maintainability
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'
      - name: Replay batch A transformations
        shell: bash
        run: |
          git show b9749e7951b44eaf76799caf8dbc60ff396f93a7:.github/workflows/nxa11-batch-a.yml > "$RUNNER_TEMP/nxa11-original.yml"
          python3 - <<'PY'
          from pathlib import Path
          source = Path('/home/runner/work/_temp/nxa11-original.yml').read_text(encoding='utf-8')
          start_marker = "          from pathlib import Path\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          block = source[start:end]
          lines = []
          for line in block.splitlines():
              if line == '':
                  lines.append('')
                  continue
              if not line.startswith('          '):
                  raise SystemExit(f'unexpected embedded-script indentation: {line!r}')
              lines.append(line[10:])
          Path('/tmp/nxa11-apply.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python3 /tmp/nxa11-apply.py
      - name: Correct replay edge cases
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fixes = {
              'core/src/test/java/com/nexus/index/jdt/JdtConfigurationBoundsTest.java': {
                  'String oversizedTimeout = oversizedTimeout;':
                      'String oversizedTimeout = Long.toString(JdtLanguageServerCodeIntelligenceProvider.MAX_TIMEOUT_SECONDS + 1L);',
                  'String oversizedSymbols = oversizedSymbols;':
                      'String oversizedSymbols = Integer.toString(JdtLanguageServerCodeIntelligenceProvider.MAX_SYMBOLS + 1);',
              },
              'core/src/test/java/com/nexus/search/semantic/SemanticSearchConfigurationBoundsTest.java': {
                  'String oversizedDimensions = oversizedDimensions;':
                      'String oversizedDimensions = Integer.toString(SemanticSearchConfiguration.MAX_OLLAMA_DIMENSIONS + 1);',
                  'String oversizedTimeout = oversizedTimeout;':
                      'String oversizedTimeout = Long.toString(SemanticSearchConfiguration.MAX_OLLAMA_TIMEOUT_SECONDS + 1L);',
              },
          }
          for file_name, replacements in fixes.items():
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  if text.count(old) != 1:
                      raise SystemExit(f'{file_name}: expected one replay edge-case match: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          path = Path('core/src/main/java/com/nexus/cli/NexusCli.java')
          text = path.read_text(encoding='utf-8')
          old = 'renderer) throws Exception {'
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'expected 3 remaining CLI generic throws declarations, found {count}')
          text = text.replace(old, 'renderer) throws IOException {')
          path.write_text(text, encoding='utf-8')

          # Keep CLI stdout semantics while making the channel injectable for tests.
          path = Path('adapters/assistant-clients/src/main/java/com/nexus/integrations/AssistantIntegrationGenerator.java')
          text = path.read_text(encoding='utf-8')
          field = '''    private static final PrintWriter STANDARD_OUTPUT = new PrintWriter(\n            new FileOutputStream(FileDescriptor.out), true, Charset.defaultCharset());\n'''
          if text.count(field) != 1:
              raise SystemExit('AssistantIntegrationGenerator: expected STANDARD_OUTPUT field')
          text = text.replace(field, '', 1)
          signature = '    public static void main(String[] args) {\n'
          replacement = '''    public static void main(String[] args) {\n        run(args, standardOutput());\n    }\n\n    static void run(String[] args, PrintWriter output) {\n'''
          if text.count(signature) != 1:
              raise SystemExit('AssistantIntegrationGenerator: expected main signature')
          text = text.replace(signature, replacement, 1)
          text = text.replace('STANDARD_OUTPUT.println(', 'output.println(')
          marker = '    private String render(String profile, CommandSpec commandSpec, String format) {\n'
          helper = '''    private static PrintWriter standardOutput() {\n        return new PrintWriter(\n                new FileOutputStream(FileDescriptor.out), true, Charset.defaultCharset());\n    }\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('AssistantIntegrationGenerator: render marker missing')
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('adapters/assistant-clients/src/test/java/com/nexus/integrations/AssistantIntegrationCliTest.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import java.io.PrintStream;\n', 'import java.io.PrintWriter;\n')
          old = '''    private static String invokeMain(String... args) {\n        PrintStream previous = System.out;\n        ByteArrayOutputStream captured = new ByteArrayOutputStream();\n        try (PrintStream replacement = new PrintStream(captured, true, StandardCharsets.UTF_8)) {\n            System.setOut(replacement);\n            AssistantIntegrationGenerator.main(args);\n        } finally {\n            System.setOut(previous);\n        }\n        return captured.toString(StandardCharsets.UTF_8).trim();\n    }\n'''
          new = '''    private static String invokeMain(String... args) {\n        ByteArrayOutputStream captured = new ByteArrayOutputStream();\n        try (PrintWriter output = new PrintWriter(captured, true, StandardCharsets.UTF_8)) {\n            AssistantIntegrationGenerator.run(args, output);\n        }\n        return captured.toString(StandardCharsets.UTF_8).trim();\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit('AssistantIntegrationCliTest: invokeMain helper mismatch')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Run reactor tests
        shell: bash
        run: |
          chmod +x ./mvnw
          ./mvnw -B test
      - name: Commit qualified batch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/nxa11-batch-a-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: clear Sonar promotion maintainability batch A'
          git push origin HEAD:fix/nxa11-sonar-promotion-maintainability
