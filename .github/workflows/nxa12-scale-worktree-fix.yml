name: NXA12 scale baseline worktree fix

on:
  push:
    branches:
      - fix/nxa12-scale-baseline-worktree

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/nxa12-scale-baseline-worktree
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build patched workflow artifact
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/scale-benchmark.yml')
          text = path.read_text(encoding='utf-8')
          start_marker = '          cp target/scale-benchmark.json "$CANDIDATE_REPORT"\n'
          end_marker = '          cp "$BASE_REPORT" target/scale-benchmark-base.json\n'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('candidate-report baseline block start not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('candidate-report baseline block end not found')
          end += len(end_marker)

          profile_expression = '$' + '{{ steps.profile.outputs.value }}'
          new = (
              '          cp target/scale-benchmark.json "$CANDIDATE_REPORT"\n'
              '          BASE_WORKTREE="$RUNNER_TEMP/nexus-scale-base"\n'
              '          rm -rf "$BASE_WORKTREE"\n'
              '          git worktree add --detach "$BASE_WORKTREE" "$BASE_SHA"\n'
              '          cleanup_base_worktree() {\n'
              '            git worktree remove --force "$BASE_WORKTREE" >/dev/null 2>&1 || true\n'
              '          }\n'
              '          trap cleanup_base_worktree EXIT\n'
              '          (\n'
              '            cd "$BASE_WORKTREE"\n'
              '            chmod +x ./mvnw\n'
              '            ./mvnw -B -pl core clean \\\n'
              '              -Dtest=ScaleRegressionBenchmarkTest \\\n'
              '              -Djunit.jupiter.execution.timeout.test.method.default=20m \\\n'
              '              -Dnexus.scale.benchmark.enabled=true \\\n'
              f'              -Dnexus.scale.benchmark.profile={profile_expression} \\\n'
              '              -Dnexus.scale.benchmark.output="$BASE_REPORT" \\\n'
              '              test\n'
              '          )\n'
              '          test -s "$BASE_REPORT"\n'
              '          mkdir -p target\n'
              '          cp "$CANDIDATE_REPORT" target/scale-benchmark.json\n'
              '          cp "$BASE_REPORT" target/scale-benchmark-base.json\n'
          )
          patched = text[:start] + new + text[end:]
          if 'git checkout --force "$BASE_SHA"' in patched or 'git checkout --force "$HEAD_SHA"' in patched:
              raise SystemExit('in-place checkout remains in patched workflow')
          if profile_expression not in patched:
              raise SystemExit('profile expression was not preserved literally')
          artifact = Path('tmp/nxa12-scale-benchmark.patched.yml')
          artifact.parent.mkdir(parents=True, exist_ok=True)
          artifact.write_text(patched, encoding='utf-8')
          PY
      - name: Publish patched workflow artifact
        shell: bash
        run: |
          grep -F 'git worktree add --detach "$BASE_WORKTREE" "$BASE_SHA"' tmp/nxa12-scale-benchmark.patched.yml
          grep -F 'test -s "$BASE_REPORT"' tmp/nxa12-scale-benchmark.patched.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/nxa12-scale-benchmark.patched.yml
          git commit -m 'ci: stage patched scale workflow artifact'
          git push origin HEAD:fix/nxa12-scale-baseline-worktree
