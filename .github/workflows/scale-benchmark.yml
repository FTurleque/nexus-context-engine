name: Scale Benchmark

on:
  workflow_call:
    inputs:
      profile:
        description: Benchmark profile
        required: false
        default: ci
        type: string
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile
        required: true
        default: full
        type: choice
        options:
          - ci
          - full

permissions:
  contents: read

concurrency:
  # github.workflow désigne le workflow appelant en workflow_call : le wrapper
  # develop-push-scale-benchmark.yml et ce workflow n'ont jamais le même groupe,
  # et aucun des deux n'annule l'autre sur une PR qui touche les deux.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    name: Hermetic scale benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Detect scale-sensitive changes
        id: changes
        shell: bash
        # WATCHED_PATHS est la source unique des chemins surveillés : le filtre push
        # de develop-push-scale-benchmark.yml en reprend exactement la liste.
        # Contrat : scripts/release/test-operational-doc-contracts.sh.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WATCHED_PATHS: |
            core/src/main/java/com/nexus/application/**
            core/src/main/java/com/nexus/index/**
            core/src/main/java/com/nexus/project/**
            core/src/main/java/com/nexus/config/**
            core/src/main/java/com/nexus/persistence/sqlite/**
            core/src/main/java/com/nexus/search/**
            core/src/main/java/com/nexus/ranking/graph/**
            core/src/main/java/com/nexus/context/**
            core/src/test/java/com/nexus/benchmark/**
            core/pom.xml
            scripts/measure-scale-regression.ps1
            scripts/verify-scale-budgets.py
            scripts/tests/test_scale_budgets.py
            config/scale-benchmark-protocol
            docs/developer/scale-regression-benchmark.md
            docs/project/history/scale-regression-results.md
            .github/workflows/scale-benchmark.yml
            .github/workflows/develop-push-scale-benchmark.yml
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "Événement $EVENT_NAME : le benchmark mesure toujours."
            echo "measure=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          MATCHED=""
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            while IFS= read -r pattern; do
              [[ -n "$pattern" ]] || continue
              # Dans [[ == ]], * couvre aussi « / » : « dir/** » vaut préfixe de répertoire.
              if [[ "$file" == $pattern ]]; then
                MATCHED+="$file"$'\n'
                break
              fi
            done <<< "$WATCHED_PATHS"
          done <<< "$CHANGED"
          if [[ -n "$MATCHED" ]]; then
            echo "Chemins surveillés touchés :"
            printf '%s' "$MATCHED"
            echo "measure=true" >> "$GITHUB_OUTPUT"
          else
            MESSAGE="Aucun chemin surveillé n'est touché par cette PR : benchmark non mesuré, check conclu en succès."
            echo "::notice::$MESSAGE"
            echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
            echo "measure=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 21
        if: steps.changes.outputs.measure == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve benchmark profile
        if: steps.changes.outputs.measure == 'true'
        id: profile
        shell: bash
        run: |
          REQUESTED="${{ inputs.profile }}"
          if [[ -z "$REQUESTED" ]]; then
            REQUESTED=ci
          fi
          if [[ "$REQUESTED" != "ci" && "$REQUESTED" != "full" ]]; then
            echo "::error::Unsupported benchmark profile: $REQUESTED"
            exit 1
          fi
          echo "value=$REQUESTED" >> "$GITHUB_OUTPUT"

      - name: Run hermetic scale benchmark
        if: steps.changes.outputs.measure == 'true'
        shell: bash
        run: |
          chmod +x ./mvnw
          ./mvnw -B -pl core \
            -Dtest=ScaleRegressionBenchmarkTest,GraphScaleRegressionBenchmarkTest,FederatedContextBudgetScaleBenchmarkTest,NativeContextDiscoveryBudgetBenchmarkTest \
            -Djunit.jupiter.execution.timeout.test.method.default=20m \
            -Dnexus.scale.benchmark.enabled=true \
            -Dnexus.scale.benchmark.profile=${{ steps.profile.outputs.value }} \
            -Dnexus.scale.benchmark.output=target/scale-benchmark.json \
            -Dnexus.graph.scale.benchmark.output=target/graph-scale-benchmark.json \
            -Dnexus.federated.scale.benchmark.output=target/federated-budget-scale-benchmark.json \
            -Dnexus.native.discovery.scale.benchmark.output=target/native-discovery-scale-benchmark.json \
            test

      - name: Run full SQLite scale curve for pull request
        if: steps.changes.outputs.measure == 'true' && github.event_name == 'pull_request'
        shell: bash
        run: |
          ./mvnw -B -pl core \
            -Dtest=ScaleRegressionBenchmarkTest \
            -Djunit.jupiter.execution.timeout.test.method.default=20m \
            -Dnexus.scale.benchmark.enabled=true \
            -Dnexus.scale.benchmark.profile=full \
            -Dnexus.scale.benchmark.output=target/scale-benchmark-sqlite-full.json \
            -Dnexus.scale.benchmark.sqliteOnly=true \
            test

      - name: Benchmark PR base SQLite storage on the same runner
        if: steps.changes.outputs.measure == 'true' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          PROTOCOL_FILE="config/scale-benchmark-protocol"
          BENCHMARK_HARNESS="core/src/test/java/com/nexus/benchmark/ScaleRegressionBenchmarkTest.java"
          CANDIDATE_REPORT="$RUNNER_TEMP/scale-benchmark-candidate.json"
          BASE_REPORT="$RUNNER_TEMP/scale-benchmark-base.json"
          POPULATION_COMPARABLE=false

          test -s "$PROTOCOL_FILE"
          HEAD_PROTOCOL="$(tr -d '\r\n[:space:]' < "$PROTOCOL_FILE")"
          BASE_PROTOCOL="$(git show "$BASE_SHA:$PROTOCOL_FILE" 2>/dev/null | tr -d '\r\n[:space:]' || true)"
          # Le harness 6 reste compatible avec l'API des protocoles 4 et 5.
          # Exécuter exactement le harness candidat sur les deux codes de production.
          if [[ "$BASE_PROTOCOL" == "$HEAD_PROTOCOL" || ( "$HEAD_PROTOCOL" == "6" && ( "$BASE_PROTOCOL" == "4" || "$BASE_PROTOCOL" == "5" ) ) ]]; then
            POPULATION_COMPARABLE=true
          else
            echo "::notice::Base/head benchmark protocols differ (base='${BASE_PROTOCOL:-absent}', head='$HEAD_PROTOCOL'). Relative population comparison is skipped, but the base 1M storage footprint is still measured on this runner."
          fi

          cp target/scale-benchmark.json "$CANDIDATE_REPORT"
          BASE_WORKTREE="$RUNNER_TEMP/nexus-scale-base"
          rm -rf "$BASE_WORKTREE"
          git worktree add --detach "$BASE_WORKTREE" "$BASE_SHA"
          if [[ "$POPULATION_COMPARABLE" == "true" ]]; then
            cp "$BENCHMARK_HARNESS" "$BASE_WORKTREE/$BENCHMARK_HARNESS"
          fi
          cleanup_base_worktree() {
            git worktree remove --force "$BASE_WORKTREE" >/dev/null 2>&1 || true
          }
          trap cleanup_base_worktree EXIT
          (
            cd "$BASE_WORKTREE"
            chmod +x ./mvnw
            ./mvnw -B -pl core clean \
              -Dtest=ScaleRegressionBenchmarkTest \
              -Djunit.jupiter.execution.timeout.test.method.default=20m \
              -Dnexus.scale.benchmark.enabled=true \
              -Dnexus.scale.benchmark.profile=full \
              -Dnexus.scale.benchmark.sqliteOnly=true \
              -Dnexus.scale.benchmark.output="$BASE_REPORT" \
              test
          )
          test -s "$BASE_REPORT"
          mkdir -p target
          cp "$CANDIDATE_REPORT" target/scale-benchmark.json
          cp "$BASE_REPORT" target/scale-benchmark-base.json
          if [[ "$POPULATION_COMPARABLE" == "true" ]]; then
            touch target/scale-benchmark-base-population-comparable
          fi

      - name: Verify report and regression budgets
        if: steps.changes.outputs.measure == 'true'
        shell: bash
        run: |
          test -s target/scale-benchmark.json
          test -s target/graph-scale-benchmark.json
          test -s target/federated-budget-scale-benchmark.json
          test -s target/native-discovery-scale-benchmark.json
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test -s target/scale-benchmark-base.json
            test -s target/scale-benchmark-sqlite-full.json
          fi
          python3 -m unittest discover -s scripts/tests -p 'test_scale_budgets.py'
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python3 scripts/verify-scale-budgets.py target --require-base
          else
            python3 scripts/verify-scale-budgets.py target
          fi

      - name: Retain benchmark report
        if: always() && steps.changes.outputs.measure == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-scale-benchmark-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}-${{ steps.profile.outputs.value }}
          retention-days: 90
          if-no-files-found: error
          path: |
            target/scale-benchmark.json
            target/scale-benchmark-sqlite-full.json
            target/scale-benchmark-base.json
            target/graph-scale-benchmark.json
            target/federated-budget-scale-benchmark.json
            target/native-discovery-scale-benchmark.json
