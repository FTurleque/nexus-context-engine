name: Windows Installer

on:
  workflow_call:
    inputs:
      require_authenticode:
        description: Require a configured Authenticode identity and signed Windows release artifacts
        required: false
        type: boolean
        default: false
    secrets:
      NEXUS_WINDOWS_SIGNING_PFX_BASE64:
        required: false
      NEXUS_WINDOWS_SIGNING_PFX_PASSWORD:
        required: false
  pull_request:
    branches:
      - main
    paths:
      - 'packaging/windows/**'
      - 'scripts/release/**'
      - 'distribution/**'
      - 'core/src/**'
      - 'adapters/**'
      - 'core/pom.xml'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:
    inputs:
      require_authenticode:
        description: Require the release environment signing secrets for this manual qualification
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # github.workflow names the caller when this workflow is reused (main-push-windows-installer.yml,
  # release.yml), so a reused run never shares the group of a direct run of this workflow.
  group: windows-installer-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-installer:
    name: Windows self-contained installer
    runs-on: windows-latest
    timeout-minutes: 45
    # Release signing runs in the protected `release` environment, which holds the Authenticode
    # secrets; any other run (pull_request, unsigned manual qualification) has no environment.
    environment:
      name: ${{ inputs.require_authenticode && 'release' || '' }}
    env:
      NEXUS_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      NEXUS_WINDOWS_REQUIRE_AUTHENTICODE: ${{ inputs.require_authenticode && 'true' || 'false' }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.NEXUS_HEAD_SHA }}

      - name: Set up pinned Java 21 runtime source
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.12+101.0.LTS'

      - name: Qualify generated cmd configuration escaping
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\scripts\release\test-windows-config-escaping.ps1

      - name: Qualify Windows SBOM augmentation on Windows PowerShell
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\scripts\release\test-windows-sbom-augmentation.ps1

      # Signing step 1/2: the only steps that receive the Authenticode secrets, never on
      # pull_request. sign-windows-artifact.ps1 decodes the PFX into a directory private to the
      # call and erases it in a finally block; no path is published to GITHUB_ENV.
      - name: Build self-contained Windows distribution
        shell: powershell
        env:
          NEXUS_WINDOWS_SIGNING_PFX_BASE64: ${{ github.event_name != 'pull_request' && secrets.NEXUS_WINDOWS_SIGNING_PFX_BASE64 || '' }}
          NEXUS_WINDOWS_SIGNING_PFX_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.NEXUS_WINDOWS_SIGNING_PFX_PASSWORD || '' }}
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          # Functional tests are qualified independently by NEXUS CI on this exact SHA.
          # This workflow is responsible for Windows packaging, signing, SBOM and installer smokes.
          .\scripts\release\build-windows-distribution.ps1 -SkipTests

      - name: Build isolated smoke installer
        shell: powershell
        run: |
          $setup = .\scripts\release\build-windows-installer.ps1 -Smoke | Select-Object -Last 1
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw "Smoke setup missing: $setup" }
          "NEXUS_SMOKE_SETUP=$setup" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install, execute and uninstall smoke setup
        shell: powershell
        run: |
          .\scripts\release\test-windows-installer.ps1 -Setup $env:NEXUS_SMOKE_SETUP

      # Signing step 2/2 (same confinement as the distribution step).
      - name: Build production installer
        shell: powershell
        env:
          NEXUS_WINDOWS_SIGNING_PFX_BASE64: ${{ github.event_name != 'pull_request' && secrets.NEXUS_WINDOWS_SIGNING_PFX_BASE64 || '' }}
          NEXUS_WINDOWS_SIGNING_PFX_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.NEXUS_WINDOWS_SIGNING_PFX_PASSWORD || '' }}
        run: |
          $setup = .\scripts\release\build-windows-installer.ps1 | Select-Object -Last 1
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw "Production setup missing: $setup" }
          if (-not (Test-Path -LiteralPath "$setup.sha256" -PathType Leaf)) { throw "Production setup checksum missing" }

      - name: Verify release artifacts signing and runtime SBOM
        shell: powershell
        run: |
          $version = ([xml](Get-Content -Raw pom.xml)).project.version
          $root = "target\dist"
          $zip = Join-Path $root "nexus-context-engine-$version-windows-x64.zip"
          $setup = Join-Path $root "NEXUS-$version-windows-x64-setup.exe"
          foreach ($file in @($zip, "$zip.sha256", $setup, "$setup.sha256")) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release artifact: $file" }
          }
          $expanded = Join-Path $root 'ci-zip-smoke'
          Remove-Item -LiteralPath $expanded -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip -DestinationPath $expanded
          $launcher = Get-ChildItem -LiteralPath $expanded -Recurse -Filter nexus.exe -File | Select-Object -First 1
          $cmdLauncher = Get-ChildItem -LiteralPath $expanded -Recurse -Filter nexus.cmd -File | Select-Object -First 1
          $sbom = Get-ChildItem -LiteralPath $expanded -Recurse -Filter SBOM.cdx.json -File | Select-Object -First 1
          if ($null -eq $launcher -or $null -eq $cmdLauncher -or $null -eq $sbom) {
            throw 'Portable ZIP is missing launcher or SBOM evidence.'
          }
          $json = & $cmdLauncher.FullName --version --json | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Portable ZIP CLI smoke failed' }
          if (($json | ConvertFrom-Json).version -ne $version) { throw 'Portable ZIP version mismatch' }

          $bom = Get-Content -LiteralPath $sbom.FullName -Raw | ConvertFrom-Json
          $profile = @($bom.metadata.properties) | Where-Object { $_.name -eq 'nexus.sbom.profile' } | Select-Object -First 1
          if ($null -eq $profile -or $profile.value -ne 'windows-self-contained-v1') {
            throw 'Windows SBOM is missing the self-contained runtime profile.'
          }
          $runtime = @($bom.components) | Where-Object { $_.name -eq 'Eclipse Temurin JRE' } | Select-Object -First 1
          if ($null -eq $runtime -or [string]::IsNullOrWhiteSpace([string]$runtime.version)) {
            throw 'Windows SBOM is missing the bundled Eclipse Temurin runtime component.'
          }
          $runtimeFiles = @($bom.components) | Where-Object { $_.type -eq 'file' -and $_.name -like 'app/runtime/*' }
          if ($runtimeFiles.Count -lt 10) {
            throw "Windows SBOM runtime inventory is unexpectedly incomplete: $($runtimeFiles.Count) file component(s)."
          }

          if ($env:NEXUS_WINDOWS_REQUIRE_AUTHENTICODE -eq 'true') {
            foreach ($signedFile in @($launcher.FullName, $setup)) {
              $signature = Get-AuthenticodeSignature -LiteralPath $signedFile
              if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
                throw "Required Authenticode signature invalid for $signedFile`: $($signature.Status)"
              }
            }
          }

      - name: Retain Windows release artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-windows-release-${{ env.NEXUS_HEAD_SHA }}
          retention-days: 90
          if-no-files-found: error
          path: |
            target/dist/nexus-context-engine-*-windows-x64.zip
            target/dist/nexus-context-engine-*-windows-x64.zip.sha256
            target/dist/NEXUS-*-windows-x64-setup.exe
            target/dist/NEXUS-*-windows-x64-setup.exe.sha256

      - name: Remove ephemeral signing material
        if: always()
        shell: powershell
        run: |
          # Defence in depth: each signing call already erases its own directory.
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Directory -Filter 'nexus-windows-signing-*' -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force

  windows-security:
    name: Windows payload SBOM and vulnerability gate
    needs: windows-installer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXUS_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Download exact qualified Windows payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nexus-windows-release-${{ env.NEXUS_HEAD_SHA }}
          path: target/windows-release

      - name: Expand exact portable distribution
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find target/windows-release -type f -name 'nexus-context-engine-*-windows-x64.zip' -print -quit)"
          test -n "$ZIP"
          mkdir -p target/windows-rootfs target/windows-security
          unzip -q "$ZIP" -d target/windows-rootfs
          PACKAGED_SBOM="$(find target/windows-rootfs -type f -name SBOM.cdx.json -print -quit)"
          test -s "$PACKAGED_SBOM"
          cp "$PACKAGED_SBOM" target/windows-security/nexus-windows-packaged.cdx.json

      - name: Generate full Trivy Windows payload vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: target/windows-rootfs
          format: json
          output: target/windows-security/trivy-windows-vulnerabilities.json
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      - name: Generate Trivy CycloneDX SBOM from final Windows payload
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: target/windows-rootfs
          format: cyclonedx
          output: target/windows-security/nexus-windows-trivy.cdx.json
          skip-setup-trivy: true
          exit-code: '0'

      - name: Block fixable HIGH or CRITICAL Windows payload vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: target/windows-rootfs
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-setup-trivy: true
          exit-code: '1'

      - name: Retain Windows security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-windows-security-${{ env.NEXUS_HEAD_SHA }}
          retention-days: 90
          if-no-files-found: error
          path: target/windows-security/
