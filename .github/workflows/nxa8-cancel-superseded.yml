name: NXA8 cancel superseded qualification runs

on:
  push:
    branches:
      - fix/nxa8-resource-bounds
    paths:
      - .github/workflows/nxa8-cancel-superseded.yml

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/nxa8-resource-bounds
          fetch-depth: 0

      - name: Cancel superseded runs for this branch only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/nxa8-resource-bounds
        run: |
          set -euo pipefail
          for status in queued in_progress waiting requested pending; do
            while read -r run_id; do
              [[ -z "$run_id" ]] && continue
              [[ "$run_id" == "$GITHUB_RUN_ID" ]] && continue
              echo "Cancelling superseded run $run_id ($status)"
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" || true
            done < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$TARGET_BRANCH&status=$status&per_page=100" \
              --jq '.workflow_runs[].id')
          done

      - name: Remove cleanup workflow and push clean branch head
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/nxa8-cancel-superseded.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'NXA8: remove qualification cleanup helper'
          git push origin HEAD:fix/nxa8-resource-bounds
