name: Main Push Windows Installer

on:
  push:
    branches:
      - main
    paths:
      - 'packaging/windows/**'
      - 'scripts/release/**'
      - 'distribution/**'
      - 'core/src/**'
      - 'adapters/**'
      - 'core/pom.xml'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.github/workflows/windows-installer.yml'
      - '.github/workflows/main-push-windows-installer.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/main-push-windows-installer.yml'

permissions:
  contents: read

jobs:
  windows-installer:
    uses: ./.github/workflows/windows-installer.yml
    permissions:
      contents: read
