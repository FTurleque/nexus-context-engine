name: Docker Distribution

on:
  pull_request:
    branches: [main]
    paths:
      - 'packaging/docker/**'
      - 'scripts/release/build-docker-image.ps1'
      - 'scripts/release/test-docker-runtime.ps1'
      - 'src/**'
      - 'core/**'
      - 'adapters/**'
      - 'pom.xml'
      - '.github/workflows/docker-distribution.yml'
  push:
    branches: [main]
    paths:
      - 'packaging/docker/**'
      - 'scripts/release/build-docker-image.ps1'
      - 'scripts/release/test-docker-runtime.ps1'
      - 'src/**'
      - 'core/**'
      - 'adapters/**'
      - 'pom.xml'
      - '.github/workflows/docker-distribution.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  docker:
    name: Docker CLI MCP REST parity and supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXUS_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.NEXUS_HEAD_SHA }}

      - name: Read project version
        id: version
        shell: bash
        run: |
          VERSION="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('pom.xml').getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          print(root.find('m:version', ns).text)
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        shell: bash
        run: docker build --pull --file packaging/docker/Dockerfile --tag nexus-context-engine:${NEXUS_HEAD_SHA} .

      - name: Smoke CLI
        shell: bash
        run: |
          docker run --rm nexus-context-engine:${NEXUS_HEAD_SHA} cli --version --json | tee /tmp/nexus-version.json
          python3 - <<'PY'
          import json
          with open('/tmp/nexus-version.json', encoding='utf-8') as handle:
              data = json.load(handle)
          assert data['version'] == '${{ steps.version.outputs.version }}', data
          PY

      - name: Smoke MCP STDIO
        shell: bash
        run: |
          CID="$(docker run -d -i nexus-context-engine:${NEXUS_HEAD_SHA} mcp)"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          sleep 2
          test "$(docker inspect -f '{{.State.Running}}' "$CID")" = true

      - name: Smoke REST on custom host port
        shell: bash
        env:
          NEXUS_REST_API_TOKEN: 6df1462d571a6925e3bc3934ee10c6c55a965116fb47e2bc4db77ac7a5d69d34
        run: |
          CID="$(docker run -d -e NEXUS_REST_API_TOKEN="$NEXUS_REST_API_TOKEN" -p 127.0.0.1:18080:8080 nexus-context-engine:${NEXUS_HEAD_SHA} rest)"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent -H "Authorization: Bearer $NEXUS_REST_API_TOKEN" http://127.0.0.1:18080/q/health/live | grep -q 'UP'; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$CID"
          exit 1

      - name: Smoke installed-payload fallback image
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/nexus-runtime-fallback"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/lib" "$STAGE/rest" "$STAGE/docker"

          CID="$(docker create nexus-context-engine:${NEXUS_HEAD_SHA})"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker cp "$CID:/opt/nexus/lib/." "$STAGE/lib/"
          docker cp "$CID:/opt/nexus/rest/." "$STAGE/rest/"
          docker rm "$CID" >/dev/null
          trap - EXIT

          cp packaging/docker/Dockerfile.runtime "$STAGE/docker/Dockerfile.runtime"
          cp packaging/docker/nexus-container-entrypoint.sh "$STAGE/docker/nexus-container-entrypoint.sh"

          FALLBACK_IMAGE="nexus-context-engine:fallback-${NEXUS_HEAD_SHA}"
          docker build --pull --file "$STAGE/docker/Dockerfile.runtime" --tag "$FALLBACK_IMAGE" "$STAGE"
          docker run --rm "$FALLBACK_IMAGE" cli --version --json | tee /tmp/nexus-fallback-version.json
          python3 - <<'PY'
          import json
          with open('/tmp/nexus-fallback-version.json', encoding='utf-8') as handle:
              data = json.load(handle)
          assert data['version'] == '${{ steps.version.outputs.version }}', data
          PY

      - name: Prepare image security evidence
        shell: bash
        run: mkdir -p target

      - name: Generate full Trivy image vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nexus-context-engine:${{ env.NEXUS_HEAD_SHA }}
          scan-type: image
          format: json
          output: target/trivy-image-vulnerabilities.json
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      - name: Generate image CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nexus-context-engine:${{ env.NEXUS_HEAD_SHA }}
          scan-type: image
          format: cyclonedx
          output: target/nexus-image.cdx.json
          skip-setup-trivy: true
          exit-code: '0'

      - name: Retain image security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: nexus-container-security-${{ env.NEXUS_HEAD_SHA }}
          path: |
            target/trivy-image-vulnerabilities.json
            target/nexus-image.cdx.json
          if-no-files-found: warn
          retention-days: 90

      - name: Block fixable HIGH or CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nexus-context-engine:${{ env.NEXUS_HEAD_SHA }}
          scan-type: image
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-setup-trivy: true
          exit-code: '1'

      - name: Publish versioned GHCR image
        id: publish
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE="ghcr.io/fturleque/nexus-context-engine"
          VERSION="${{ steps.version.outputs.version }}"
          docker tag nexus-context-engine:${NEXUS_HEAD_SHA} "$IMAGE:$VERSION"
          docker tag nexus-context-engine:${NEXUS_HEAD_SHA} "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          docker pull "$IMAGE:$VERSION" >/dev/null
          REPO_DIGEST="$(docker image inspect "$IMAGE:$VERSION" --format '{{index .RepoDigests 0}}')"
          DIGEST="${REPO_DIGEST#*@}"
          test -n "$DIGEST"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest container build provenance
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attest container SBOM
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: target/nexus-image.cdx.json
          push-to-registry: true
