name: Docker Distribution

on:
  pull_request:
    branches: [main]
    paths:
      - 'packaging/docker/**'
      - 'scripts/release/build-docker-image.ps1'
      - 'scripts/release/test-docker-runtime.ps1'
      - 'src/**'
      - 'core/**'
      - 'adapters/**'
      - 'pom.xml'
      - '.github/workflows/docker-distribution.yml'
  push:
    branches: [main]
    paths:
      - 'packaging/docker/**'
      - 'scripts/release/build-docker-image.ps1'
      - 'scripts/release/test-docker-runtime.ps1'
      - 'src/**'
      - 'core/**'
      - 'adapters/**'
      - 'pom.xml'
      - '.github/workflows/docker-distribution.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Docker CLI MCP REST parity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Read project version
        id: version
        shell: bash
        run: |
          VERSION="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('pom.xml').getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          print(root.find('m:version', ns).text)
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        shell: bash
        run: docker build --pull --file packaging/docker/Dockerfile --tag nexus-context-engine:${{ github.sha }} .

      - name: Smoke CLI
        shell: bash
        run: |
          docker run --rm nexus-context-engine:${{ github.sha }} cli --version --json | tee /tmp/nexus-version.json
          python3 - <<'PY'
          import json
          with open('/tmp/nexus-version.json', encoding='utf-8') as handle:
              data = json.load(handle)
          assert data['version'] == '${{ steps.version.outputs.version }}', data
          PY

      - name: Smoke MCP STDIO
        shell: bash
        run: |
          CID="$(docker run -d -i nexus-context-engine:${{ github.sha }} mcp)"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          sleep 2
          test "$(docker inspect -f '{{.State.Running}}' "$CID")" = true

      - name: Smoke REST on custom host port
        shell: bash
        run: |
          CID="$(docker run -d -p 127.0.0.1:18080:8080 nexus-context-engine:${{ github.sha }} rest)"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/q/health/live | grep -q 'UP'; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$CID"
          exit 1

      - name: Publish versioned GHCR image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE="ghcr.io/fturleque/nexus-context-engine"
          docker tag nexus-context-engine:${{ github.sha }} "$IMAGE:${{ steps.version.outputs.version }}"
          docker tag nexus-context-engine:${{ github.sha }} "$IMAGE:latest"
          docker push "$IMAGE:${{ steps.version.outputs.version }}"
          docker push "$IMAGE:latest"
