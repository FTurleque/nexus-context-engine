name: Runtime Flags Qualification

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/runtime-flags-qualification.yml'
      - 'core/src/main/java/com/nexus/persistence/sqlite/**'
      - 'core/src/main/java/com/nexus/search/**'
      - 'core/src/test/java/com/nexus/benchmark/**'
      - 'core/pom.xml'
      - 'distribution/bin/**'
      - 'packaging/docker/**'
      - 'adapters/mcp-java/**'
      - 'adapters/rest-quarkus/**'
      - 'mvnw.cmd'
      - 'scripts/release/test-tool-integrity-anchors.sh'
      - 'docs/developer/runtime-flags-qualification.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warning-contract-linux:
    name: Linux Java 21 warning contract (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [baseline, tuned]
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Resolve supported tuned flags
        id: flags
        shell: bash
        run: |
          set -euo pipefail
          flags='--enable-native-access=ALL-UNNAMED'
          vector=false
          if java --list-modules | grep -q '^jdk.incubator.vector@'; then
            flags="$flags --add-modules=jdk.incubator.vector"
            vector=true
          fi
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "vector=$vector" >> "$GITHUB_OUTPUT"
      - name: Run focused SQLite/Lucene contract
        shell: bash
        env:
          QUALIFICATION_PROFILE: ${{ matrix.profile }}
          QUALIFIED_FLAGS: ${{ steps.flags.outputs.flags }}
          VECTOR_AVAILABLE: ${{ steps.flags.outputs.vector }}
        run: |
          set -euo pipefail
          mkdir -p target/runtime-flags
          if [[ "$QUALIFICATION_PROFILE" == tuned ]]; then
            export JDK_JAVA_OPTIONS="$QUALIFIED_FLAGS"
          else
            unset JDK_JAVA_OPTIONS || true
          fi
          chmod +x ./mvnw
          ./mvnw -B -pl core \
            -Dtest=SearchServiceIntegrationTest,LuceneSearchIndexTest \
            test 2>&1 | tee "target/runtime-flags/linux-java21-${QUALIFICATION_PROFILE}.log"
          log="target/runtime-flags/linux-java21-${QUALIFICATION_PROFILE}.log"
          if [[ "$QUALIFICATION_PROFILE" == baseline ]]; then
            grep -q -- '--enable-native-access=ALL-UNNAMED' "$log"
            if [[ "$VECTOR_AVAILABLE" == true ]]; then
              grep -q -- '--add-modules jdk.incubator.vector' "$log"
            fi
          else
            if grep -q -- 'Use --enable-native-access=ALL-UNNAMED' "$log"; then
              echo '::error::Native-access warning remains with tuned flags'
              exit 1
            fi
            if [[ "$VECTOR_AVAILABLE" == true ]] && grep -q -- 'vector incubator module is not readable' "$log"; then
              echo '::error::Lucene vector warning remains with tuned flags'
              exit 1
            fi
          fi
      - name: Retain Linux warning evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-flags-linux-java21-${{ matrix.profile }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: target/runtime-flags/*.log

  warning-contract-windows:
    name: Windows Java 24 warning contract (${{ matrix.profile }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [baseline, tuned]
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up Java 24
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '24'
      - name: Resolve supported tuned flags
        id: flags
        shell: pwsh
        run: |
          $flags = '--enable-native-access=ALL-UNNAMED'
          $modules = & java --list-modules | Out-String
          $vector = $modules -match '(?m)^jdk\.incubator\.vector@'
          if ($vector) { $flags += ' --add-modules=jdk.incubator.vector' }
          "flags=$flags" >> $env:GITHUB_OUTPUT
          "vector=$($vector.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Run focused SQLite/Lucene contract
        shell: pwsh
        env:
          QUALIFICATION_PROFILE: ${{ matrix.profile }}
          QUALIFIED_FLAGS: ${{ steps.flags.outputs.flags }}
          VECTOR_AVAILABLE: ${{ steps.flags.outputs.vector }}
        run: |
          New-Item -ItemType Directory -Force -Path target/runtime-flags | Out-Null
          if ($env:QUALIFICATION_PROFILE -eq 'tuned') {
            $env:JDK_JAVA_OPTIONS = $env:QUALIFIED_FLAGS
          } else {
            Remove-Item Env:JDK_JAVA_OPTIONS -ErrorAction SilentlyContinue
          }
          $log = "target/runtime-flags/windows-java24-$($env:QUALIFICATION_PROFILE).log"
          & .\mvnw.cmd -B -pl core `
            '-Dtest=SearchServiceIntegrationTest,LuceneSearchIndexTest' `
            test 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $content = Get-Content -Raw -LiteralPath $log
          if ($env:QUALIFICATION_PROFILE -eq 'baseline') {
            if ($content -notmatch '--enable-native-access=ALL-UNNAMED') { throw 'Expected native-access baseline warning was not observed' }
            if ($env:VECTOR_AVAILABLE -eq 'true' -and $content -notmatch '--add-modules jdk.incubator.vector') { throw 'Expected vector baseline warning was not observed' }
          } else {
            if ($content -match 'Use --enable-native-access=ALL-UNNAMED') { throw 'Native-access warning remains with tuned flags' }
            if ($env:VECTOR_AVAILABLE -eq 'true' -and $content -match 'vector incubator module is not readable') { throw 'Lucene vector warning remains with tuned flags' }
          }
      - name: Retain Windows warning evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-flags-windows-java24-${{ matrix.profile }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: target/runtime-flags/*.log

  scale-comparison:
    name: Linux Java 21 same-runner ABBA scale comparison
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Run baseline/tuned ABBA on one runner
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./mvnw
          mkdir -p target/runtime-flags

          run_profile() {
            label="$1"
            flags="$2"
            out="target/runtime-flags/$label"
            mkdir -p "$out"
            if [[ -n "$flags" ]]; then
              export JDK_JAVA_OPTIONS="$flags"
            else
              unset JDK_JAVA_OPTIONS || true
            fi
            ./mvnw -B -pl core \
              -Dtest=ScaleRegressionBenchmarkTest,GraphScaleRegressionBenchmarkTest,FederatedContextBudgetScaleBenchmarkTest,NativeContextDiscoveryBudgetBenchmarkTest \
              -Djunit.jupiter.execution.timeout.test.method.default=20m \
              -Dnexus.scale.benchmark.enabled=true \
              -Dnexus.scale.benchmark.profile=ci \
              -Dnexus.scale.benchmark.output="$out/scale.json" \
              -Dnexus.graph.scale.benchmark.output="$out/graph.json" \
              -Dnexus.federated.scale.benchmark.output="$out/federated.json" \
              -Dnexus.native.discovery.scale.benchmark.output="$out/native.json" \
              test 2>&1 | tee "$out/run.log"
          }

          tuned='--enable-native-access=ALL-UNNAMED --add-modules=jdk.incubator.vector'
          run_profile baseline-a ''
          run_profile tuned-a "$tuned"
          run_profile tuned-b "$tuned"
          run_profile baseline-b ''

          python3 - <<'PY'
          import json
          import statistics
          from pathlib import Path

          labels = ('baseline-a', 'tuned-a', 'tuned-b', 'baseline-b')
          reports = {}
          for label in labels:
              root = Path('target/runtime-flags') / label
              scale = json.loads((root / 'scale.json').read_text())
              graph = json.loads((root / 'graph.json').read_text())
              native = json.loads((root / 'native.json').read_text())
              federated = json.loads((root / 'federated.json').read_text())
              assert scale['profile'] == 'ci'
              assert scale['sqliteTiers'][-1]['symbols'] == 100_000
              assert scale['semanticRecovery']['documents'] == 5_000
              assert graph['symbols'] == 100_000 and graph['relations'] == 100_000
              assert native['skills'] == 1_000 and native['visitedEntries'] == 2_001
              assert federated['projects'] == 100 and federated['globalBudget'] == 200_000
              reports[label] = {
                  'totalMs': scale['totalDurationMs'],
                  'graphP95Ms': graph['p95Ms'],
                  'nativeMs': native['durationMs'],
                  'federatedMs': federated['durationMs'],
              }

          baseline = [reports['baseline-a'], reports['baseline-b']]
          tuned = [reports['tuned-a'], reports['tuned-b']]
          summary = {
              'order': list(labels),
              'runs': reports,
              'baselineMedianTotalMs': statistics.median(x['totalMs'] for x in baseline),
              'tunedMedianTotalMs': statistics.median(x['totalMs'] for x in tuned),
              'baselineMedianGraphP95Ms': statistics.median(x['graphP95Ms'] for x in baseline),
              'tunedMedianGraphP95Ms': statistics.median(x['graphP95Ms'] for x in tuned),
          }
          summary['totalRatio'] = summary['tunedMedianTotalMs'] / summary['baselineMedianTotalMs']
          summary['graphP95Ratio'] = summary['tunedMedianGraphP95Ms'] / summary['baselineMedianGraphP95Ms']
          Path('target/runtime-flags/summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY
      - name: Retain same-runner benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-flags-scale-abba-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: target/runtime-flags/**
