name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate immutable release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      release_sha: ${{ steps.identity.outputs.release_sha }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate tag, Maven version and main HEAD
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('pom.xml').getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          print(root.find('m:version', ns).text)
          PY
          )"
          RELEASE_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          chmod +x scripts/release/validate-release-tag.sh
          scripts/release/validate-release-tag.sh "$GITHUB_REF_NAME" "$VERSION" "$RELEASE_SHA" "$MAIN_SHA"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  nexus-ci:
    name: NEXUS CI release gate
    needs: validate-release
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  windows-installer:
    name: Windows installer release gate
    needs: validate-release
    uses: ./.github/workflows/windows-installer.yml
    with:
      require_authenticode: true
    secrets: inherit
    permissions:
      contents: read

  docker-distribution:
    name: Docker distribution release gate
    needs: validate-release
    uses: ./.github/workflows/docker-distribution.yml
    with:
      export_qualified_image: true
    permissions:
      contents: read

  scale-benchmark:
    name: Full scale release gate
    needs: validate-release
    uses: ./.github/workflows/scale-benchmark.yml
    with:
      profile: full
    permissions:
      contents: read

  scanner-corpus-benchmark:
    name: Full scanner corpus release gate
    needs: validate-release
    uses: ./.github/workflows/scanner-corpus-benchmark.yml
    with:
      profile: full
    permissions:
      contents: read

  codeql:
    name: CodeQL release gate
    needs: validate-release
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  osv:
    name: OSV release gate
    needs: validate-release
    uses: ./.github/workflows/osv-scanner.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  publish:
    name: Publish immutable release
    needs:
      - validate-release
      - nexus-ci
      - windows-installer
      - docker-distribution
      - scale-benchmark
      - scanner-corpus-benchmark
      - codeql
      - osv
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      NEXUS_HEAD_SHA: ${{ needs.validate-release.outputs.release_sha }}
      NEXUS_VERSION: ${{ needs.validate-release.outputs.version }}
      NEXUS_IMAGE: ghcr.io/fturleque/nexus-context-engine
      QUALIFIED_IMAGE_SHA256: ${{ needs.docker-distribution.outputs.qualified_image_sha256 }}
      QUALIFIED_IMAGE_ID: ${{ needs.docker-distribution.outputs.qualified_image_id }}
    steps:
      - name: Checkout exact qualified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.NEXUS_HEAD_SHA }}

      - name: Revalidate release identity before publication
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          chmod +x scripts/release/validate-release-tag.sh
          scripts/release/validate-release-tag.sh "$GITHUB_REF_NAME" "$NEXUS_VERSION" "$NEXUS_HEAD_SHA" "$MAIN_SHA"

      - name: Download exact qualified image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nexus-qualified-image-${{ env.NEXUS_HEAD_SHA }}
          path: target/qualified-image

      - name: Download qualification container security evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nexus-container-security-${{ env.NEXUS_HEAD_SHA }}
          path: target/release

      - name: Download exact qualified Windows release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nexus-windows-release-${{ env.NEXUS_HEAD_SHA }}
          path: target/windows-release

      - name: Download qualification Windows security evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nexus-windows-security-${{ env.NEXUS_HEAD_SHA }}
          path: target/windows-security

      - name: Verify and load exact qualified image
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="target/qualified-image/nexus-qualified-image.tar"
          METADATA="target/qualified-image/metadata.txt"
          test -s "$ARCHIVE"
          test -s "$METADATA"
          test -s target/release/trivy-image-vulnerabilities.json
          test -s target/release/nexus-image.cdx.json
          if [[ ! "$QUALIFIED_IMAGE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Reusable Docker gate did not return a valid archive SHA-256: $QUALIFIED_IMAGE_SHA256"
            exit 1
          fi
          if [[ ! "$QUALIFIED_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Reusable Docker gate did not return a valid image id: $QUALIFIED_IMAGE_ID"
            exit 1
          fi
          ACTUAL_SHA256="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          if [[ "$ACTUAL_SHA256" != "$QUALIFIED_IMAGE_SHA256" ]]; then
            echo "::error::Qualified image artifact hash mismatch: expected=$QUALIFIED_IMAGE_SHA256 actual=$ACTUAL_SHA256"
            exit 1
          fi
          grep -Fx "head_sha=$NEXUS_HEAD_SHA" "$METADATA"
          grep -Fx "image_id=$QUALIFIED_IMAGE_ID" "$METADATA"
          grep -Fx "tar_sha256=$QUALIFIED_IMAGE_SHA256" "$METADATA"
          docker load --input "$ARCHIVE"
          LOCAL_REF="nexus-context-engine:${NEXUS_HEAD_SHA}"
          ACTUAL_IMAGE_ID="$(docker image inspect "$LOCAL_REF" --format '{{.Id}}')"
          if [[ "$ACTUAL_IMAGE_ID" != "$QUALIFIED_IMAGE_ID" ]]; then
            echo "::error::Loaded image identity mismatch: expected=$QUALIFIED_IMAGE_ID actual=$ACTUAL_IMAGE_ID"
            exit 1
          fi

      - name: Verify exact qualified Windows artifacts and evidence
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find target/windows-release -type f -name 'nexus-context-engine-*-windows-x64.zip' -print -quit)"
          SETUP="$(find target/windows-release -type f -name 'NEXUS-*-windows-x64-setup.exe' -print -quit)"
          test -s "$ZIP"
          test -s "$SETUP"
          test -s "$ZIP.sha256"
          test -s "$SETUP.sha256"
          test -s target/windows-security/nexus-windows-packaged.cdx.json
          test -s target/windows-security/nexus-windows-trivy.cdx.json
          test -s target/windows-security/trivy-windows-vulnerabilities.json

          verify_checksum() {
            local artifact="$1"
            local checksum_file="$artifact.sha256"
            local expected actual
            expected="$(tr -d '\r\n' < "$checksum_file" | awk '{print $1}')"
            actual="$(sha256sum "$artifact" | awk '{print $1}')"
            if [[ ! "$expected" =~ ^[0-9a-f]{64}$ || "$actual" != "$expected" ]]; then
              echo "::error::Windows artifact checksum mismatch: artifact=$artifact expected=$expected actual=$actual"
              exit 1
            fi
          }
          verify_checksum "$ZIP"
          verify_checksum "$SETUP"

      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Fail-closed immutable tag preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/release/ghcr-immutable-preflight.sh
          scripts/release/ghcr-immutable-preflight.sh \
            "$NEXUS_IMAGE" \
            "$NEXUS_VERSION" \
            "$NEXUS_HEAD_SHA" \
            "nexus-context-engine:${NEXUS_HEAD_SHA}" \
            "$GITHUB_OUTPUT"

      - name: Publish or resume immutable version and SHA tags
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          VERSION_REF="$NEXUS_IMAGE:$NEXUS_VERSION"
          SHA_REF="$NEXUS_IMAGE:sha-$NEXUS_HEAD_SHA"
          LOCAL_REF="nexus-context-engine:${NEXUS_HEAD_SHA}"

          VERSION_EXISTS="${{ steps.preflight.outputs.version_exists }}"
          SHA_EXISTS="${{ steps.preflight.outputs.sha_exists }}"

          if [[ "$VERSION_EXISTS" == "false" && "$SHA_EXISTS" == "false" ]]; then
            docker tag "$LOCAL_REF" "$VERSION_REF"
            docker push "$VERSION_REF"
            docker buildx imagetools create --prefer-index=false --tag "$SHA_REF" "$VERSION_REF"
          elif [[ "$VERSION_EXISTS" == "true" && "$SHA_EXISTS" == "false" ]]; then
            docker buildx imagetools create --prefer-index=false --tag "$SHA_REF" "$VERSION_REF"
          elif [[ "$VERSION_EXISTS" == "false" && "$SHA_EXISTS" == "true" ]]; then
            docker buildx imagetools create --prefer-index=false --tag "$VERSION_REF" "$SHA_REF"
          else
            echo "Both immutable tags already exist with the qualified image identity; resuming without rewriting them."
          fi

          docker pull "$VERSION_REF" >/dev/null
          VERSION_REPO_DIGEST="$(docker image inspect "$VERSION_REF" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep "^${NEXUS_IMAGE}@" | head -n 1)"
          DIGEST="${VERSION_REPO_DIGEST#*@}"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unable to resolve immutable version digest: $VERSION_REPO_DIGEST"
            exit 1
          fi
          VERSION_IMAGE_ID="$(docker image inspect "$VERSION_REF" --format '{{.Id}}')"
          if [[ "$VERSION_IMAGE_ID" != "$QUALIFIED_IMAGE_ID" ]]; then
            echo "::error::Published version image differs from qualified image: version=$VERSION_IMAGE_ID qualified=$QUALIFIED_IMAGE_ID"
            exit 1
          fi

          docker pull "$SHA_REF" >/dev/null
          SHA_REPO_DIGEST="$(docker image inspect "$SHA_REF" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep "^${NEXUS_IMAGE}@" | head -n 1)"
          SHA_DIGEST="${SHA_REPO_DIGEST#*@}"
          SHA_IMAGE_ID="$(docker image inspect "$SHA_REF" --format '{{.Id}}')"
          if [[ "$SHA_DIGEST" != "$DIGEST" ]]; then
            echo "::error::Version/SHA manifest digest mismatch: version=$DIGEST sha=$SHA_DIGEST"
            exit 1
          fi
          if [[ "$SHA_IMAGE_ID" != "$QUALIFIED_IMAGE_ID" ]]; then
            echo "::error::Published SHA image differs from qualified image: sha=$SHA_IMAGE_ID qualified=$QUALIFIED_IMAGE_ID"
            exit 1
          fi

          echo "image=$NEXUS_IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest qualified container provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attest qualification SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: target/release/nexus-image.cdx.json
          push-to-registry: true

      - name: Publish or resume immutable GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x scripts/release/publish-github-release-assets.sh
          mapfile -t ASSETS < <(
            find target/windows-release -type f \( \
              -name 'nexus-context-engine-*-windows-x64.zip' -o \
              -name 'nexus-context-engine-*-windows-x64.zip.sha256' -o \
              -name 'NEXUS-*-windows-x64-setup.exe' -o \
              -name 'NEXUS-*-windows-x64-setup.exe.sha256' \
            \) -print | sort
            find target/windows-security -type f -name '*.json' -print | sort
            printf '%s\n' \
              target/release/nexus-image.cdx.json \
              target/release/trivy-image-vulnerabilities.json
          )
          if [[ ${#ASSETS[@]} -lt 9 ]]; then
            echo "::error::Release asset set is unexpectedly incomplete: ${#ASSETS[@]} file(s)"
            printf '%s\n' "${ASSETS[@]}"
            exit 1
          fi
          scripts/release/publish-github-release-assets.sh "$GITHUB_REF_NAME" "${ASSETS[@]}"

      - name: Move latest only after immutable publication attestations and release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION_REF="$NEXUS_IMAGE:$NEXUS_VERSION"
          LATEST_REF="$NEXUS_IMAGE:latest"
          docker buildx imagetools create --prefer-index=false --tag "$LATEST_REF" "$VERSION_REF"
          docker pull "$LATEST_REF" >/dev/null
          LATEST_REPO_DIGEST="$(docker image inspect "$LATEST_REF" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep "^${NEXUS_IMAGE}@" | head -n 1)"
          LATEST_DIGEST="${LATEST_REPO_DIGEST#*@}"
          if [[ "$LATEST_DIGEST" != "${{ steps.publish.outputs.digest }}" ]]; then
            echo "::error::latest does not point to the qualified release digest: latest=$LATEST_DIGEST release=${{ steps.publish.outputs.digest }}"
            exit 1
          fi
          printf 'published-version=%s\npublished-sha=%s\npublished-digest=%s\n' "$NEXUS_VERSION" "$NEXUS_HEAD_SHA" "${{ steps.publish.outputs.digest }}"
