name: NXA11 stdout lifetime qualification

on:
  push:
    branches:
      - fix/nxa11-sonar-promotion-maintainability

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/nxa11-sonar-promotion-maintainability
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'
      - name: Make stdout writer process-scoped
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('adapters/assistant-clients/src/main/java/com/nexus/integrations/AssistantIntegrationGenerator.java')
          text = path.read_text(encoding='utf-8')
          anchor = '    public static final String NATIVE_ACCESS_ARGUMENT = "--enable-native-access=ALL-UNNAMED";\n'
          field = '''    private static final PrintWriter STANDARD_OUTPUT = new PrintWriter(\n            new FileOutputStream(FileDescriptor.out), true, Charset.defaultCharset());\n'''
          if field not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('stdout field anchor mismatch')
              text = text.replace(anchor, anchor + field, 1)
          if text.count('        run(args, standardOutput());') != 1:
              raise SystemExit('main stdout call mismatch')
          text = text.replace('        run(args, standardOutput());', '        run(args, STANDARD_OUTPUT);', 1)
          helper = '''    private static PrintWriter standardOutput() {\n        return new PrintWriter(\n                new FileOutputStream(FileDescriptor.out), true, Charset.defaultCharset());\n    }\n\n'''
          if text.count(helper) != 1:
              raise SystemExit('standardOutput helper mismatch')
          text = text.replace(helper, '', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Run affected reactor tests
        shell: bash
        run: |
          chmod +x ./mvnw
          ./mvnw -B -pl adapters/assistant-clients -am test
      - name: Commit qualified fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/nxa11-reliability-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep assistant stdout writer process-scoped'
          git push origin HEAD:fix/nxa11-sonar-promotion-maintainability
