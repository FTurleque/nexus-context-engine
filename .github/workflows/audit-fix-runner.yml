name: Run audited hardening patch

on:
  push:
    branches:
      - fix/audit-hardening-2026-09-08

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract and apply patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/audit-fix-autopatch.yml').read_text(encoding='utf-8')
          marker = "python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'audit-fix-autopatch.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Run Maven reactor
        shell: bash
        run: |
          chmod +x ./mvnw
          ./mvnw -B clean install

      - name: Commit verified fixes
        shell: bash
        run: |
          rm .github/workflows/audit-fix-autopatch.yml
          rm .github/workflows/audit-fix-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden audited context and output boundaries"
          git push origin HEAD:fix/audit-hardening-2026-09-08
