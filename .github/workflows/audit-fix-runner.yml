name: Run audited hardening patch

on:
  push:
    branches:
      - fix/audit-hardening-2026-09-08

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract and apply patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/audit-fix-autopatch.yml').read_text(encoding='utf-8')
          marker = "python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          lines = workflow[start:end].splitlines()

          normalized = []
          inside_triple = False
          for line in lines:
              contains_triple = "'''" in line
              if inside_triple and not contains_triple:
                  normalized.append(line)
                  continue

              adjusted = line[10:] if line.startswith("          ") else line
              normalized.append(adjusted)
              if adjusted.count("'''") % 2 == 1:
                  inside_triple = not inside_triple

          script = "\n".join(normalized)
          exec(compile(script, 'audit-fix-autopatch.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Repair terminal sanitizer regression test source
        shell: bash
        run: |
          cat > core/src/test/java/com/nexus/cli/CliRendererTerminalSanitizationTest.java <<'JAVA'
          package com.nexus.cli;

          import com.nexus.context.ContextBundle;
          import com.nexus.context.ContextItem;
          import com.nexus.project.IndexStatus;
          import com.nexus.project.ProjectDescriptor;
          import com.nexus.project.ProjectSourceType;
          import com.nexus.search.CandidateType;
          import org.junit.jupiter.api.Test;
          import org.junit.jupiter.api.io.TempDir;

          import java.io.ByteArrayOutputStream;
          import java.io.PrintStream;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Path;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;
          import java.util.UUID;

          import static org.junit.jupiter.api.Assertions.assertFalse;
          import static org.junit.jupiter.api.Assertions.assertTrue;

          class CliRendererTerminalSanitizationTest {

              @TempDir
              Path root;

              @Test
              void neutralizesTerminalControlsInHumanContextOutputWithoutChangingJsonContracts() throws Exception {
                  String escape = Character.toString(0x1B);
                  String bell = Character.toString(0x07);
                  ByteArrayOutputStream bytes = new ByteArrayOutputStream();
                  try (PrintStream output = new PrintStream(bytes, true, StandardCharsets.UTF_8)) {
                      CliRenderer renderer = new CliRenderer(output, output, false);
                      ProjectDescriptor project = new ProjectDescriptor(
                              UUID.randomUUID(), "project", root, ProjectSourceType.LOCAL,
                              Set.of("java"), Set.of(), null, IndexStatus.READY);
                      ContextItem item = new ContextItem(
                              CandidateType.FILE,
                              Path.of("src/Main.java"),
                              null,
                              1,
                              1,
                              "safe" + escape + "]0;owned" + bell + "text",
                              1.0d,
                              Map.of("test", 1.0d),
                              List.of("reason" + escape + "[2J"),
                              10,
                              false);
                      ContextBundle bundle = new ContextBundle(
                              List.of(item), 100, 10, List.of("excluded" + escape + "[H"), Map.of());

                      renderer.renderContext(project, "query" + escape + "[2J", true, 1L, bundle);
                  }

                  String rendered = bytes.toString(StandardCharsets.UTF_8);
                  assertFalse(rendered.contains(escape));
                  assertFalse(rendered.contains(bell));
                  assertTrue(rendered.contains("\\u001B"));
                  assertTrue(rendered.contains("\\u0007"));
              }
          }
          JAVA

      - name: Commit audited fixes
        shell: bash
        run: |
          rm .github/workflows/audit-fix-autopatch.yml
          rm .github/workflows/audit-fix-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden audited context and output boundaries"
          git push origin HEAD:fix/audit-hardening-2026-09-08

      - name: Run Maven reactor
        shell: bash
        run: |
          chmod +x ./mvnw
          ./mvnw -B clean install
