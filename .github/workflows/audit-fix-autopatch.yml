name: Apply audited hardening fixes

on:
  push:
    branches:
      - fix/audit-hardening-2026-09-08

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825a76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply audited fixes and regression tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, content):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          def replace_once(path, old, new):
              content = read(path)
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}: {old[:120]!r}")
              write(path, content.replace(old, new, 1))

          def replace_all(path, old, new, expected):
              content = read(path)
              count = content.count(old)
              if count != expected:
                  raise SystemExit(f"expected {expected} matches in {path}, found {count}: {old[:120]!r}")
              write(path, content.replace(old, new))

          # NEXUS-A01: shared physical materialization budget.
          write('core/src/main/java/com/nexus/context/ContextMaterializationLimits.java', '''package com.nexus.context;

/** Physical I/O limits for task-context materialization. */
public record ContextMaterializationLimits(long maxCumulativeBytes) {

    public static final String MAX_CUMULATIVE_BYTES_ENVIRONMENT_VARIABLE =
            "NEXUS_MAX_CONTEXT_MATERIALIZATION_BYTES";
    public static final long DEFAULT_MAX_CUMULATIVE_BYTES = 64L * 1024L * 1024L;
    public static final long MAX_CONFIGURABLE_CUMULATIVE_BYTES = 512L * 1024L * 1024L;

    public ContextMaterializationLimits {
        if (maxCumulativeBytes <= 0L || maxCumulativeBytes > MAX_CONFIGURABLE_CUMULATIVE_BYTES) {
            throw new IllegalArgumentException(
                    "maxCumulativeBytes must be between 1 and "
                            + MAX_CONFIGURABLE_CUMULATIVE_BYTES + " bytes");
        }
    }

    public static ContextMaterializationLimits fromEnvironment() {
        String configured = System.getenv(MAX_CUMULATIVE_BYTES_ENVIRONMENT_VARIABLE);
        if (configured == null || configured.isBlank()) {
            return new ContextMaterializationLimits(DEFAULT_MAX_CUMULATIVE_BYTES);
        }
        return new ContextMaterializationLimits(parseMaxCumulativeBytes(configured));
    }

    static long parseMaxCumulativeBytes(String configured) {
        try {
            long value = Long.parseLong(configured.trim());
            if (value <= 0L || value > MAX_CONFIGURABLE_CUMULATIVE_BYTES) {
                throw new IllegalArgumentException(
                        MAX_CUMULATIVE_BYTES_ENVIRONMENT_VARIABLE + " doit être compris entre 1 et "
                                + MAX_CONFIGURABLE_CUMULATIVE_BYTES + " octets");
            }
            return value;
        } catch (NumberFormatException exception) {
            throw new IllegalArgumentException(
                    MAX_CUMULATIVE_BYTES_ENVIRONMENT_VARIABLE + " doit être un entier en octets",
                    exception);
        }
    }

    public ContextMaterializationBudget newBudget() {
        return new ContextMaterializationBudget(this);
    }
}
''')

          write('core/src/main/java/com/nexus/context/ContextMaterializationLimitExceededException.java', '''package com.nexus.context;

import java.io.IOException;

/** Raised when a context request exhausts its cumulative task-materialization I/O budget. */
final class ContextMaterializationLimitExceededException extends IOException {

    ContextMaterializationLimitExceededException(String message) {
        super(message);
    }
}
''')

          write('core/src/main/java/com/nexus/context/ContextMaterializationBudget.java', '''package com.nexus.context;

import com.nexus.security.SafeFileIO;

import java.io.ByteArrayOutputStream;
import java.io.IOException;
import java.io.InputStream;
import java.nio.charset.StandardCharsets;
import java.nio.file.Path;
import java.util.Objects;

/**
 * Mutable per-request budget for physical task-source materialization.
 *
 * <p>The same instance is propagated across every project participating in a
 * federated request. Reads are charged as bytes are physically traversed. When
 * the budget is exactly exhausted, one sentinel byte may be read to distinguish
 * EOF from overflow; that byte is never admitted into the returned content.</p>
 */
public final class ContextMaterializationBudget {

    private static final int READ_BUFFER_SIZE = 16 * 1024;

    private final ContextMaterializationLimits limits;
    private int openedFiles;
    private long cumulativeBytes;

    ContextMaterializationBudget(ContextMaterializationLimits limits) {
        this.limits = Objects.requireNonNull(limits, "limits");
    }

    public synchronized String readUtf8NoFollow(Path path) throws IOException {
        Objects.requireNonNull(path, "path");
        openedFiles++;
        try (InputStream input = SafeFileIO.newInputStreamNoFollow(path);
             ByteArrayOutputStream output = new ByteArrayOutputStream()) {
            byte[] buffer = new byte[READ_BUFFER_SIZE];
            while (true) {
                long remaining = limits.maxCumulativeBytes() - cumulativeBytes;
                if (remaining == 0L) {
                    if (input.read() < 0) {
                        break;
                    }
                    throw exceeded(path);
                }

                int allowed = (int) Math.min(READ_BUFFER_SIZE, remaining);
                int read = input.read(buffer, 0, allowed);
                if (read < 0) {
                    break;
                }
                if (read == 0) {
                    continue;
                }
                cumulativeBytes += read;
                output.write(buffer, 0, read);
            }
            return output.toString(StandardCharsets.UTF_8);
        }
    }

    public ContextMaterializationLimits limits() {
        return limits;
    }

    public synchronized long remainingBytes() {
        return limits.maxCumulativeBytes() - cumulativeBytes;
    }

    public synchronized Snapshot snapshot() {
        return new Snapshot(openedFiles, cumulativeBytes, remainingBytes());
    }

    private ContextMaterializationLimitExceededException exceeded(Path path) {
        return new ContextMaterializationLimitExceededException(
                "Budget de matérialisation du contexte dépassé: maximum "
                        + limits.maxCumulativeBytes() + " octets cumulés sur " + path);
    }

    public record Snapshot(int openedFiles, long cumulativeBytes, long remainingBytes) {
    }
}
''')

